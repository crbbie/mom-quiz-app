name: Mom Quiz regression checks
on:
  push:
    branches: [redesign/stitch-ui-ux]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate question bank
        run: python tools/validate_questions.py
      - name: JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/store.js
      - name: All regression suites
        run: |
          set -e
          for file in tools/run*tests.js; do
            echo "Running $file"
            node "$file"
          done
